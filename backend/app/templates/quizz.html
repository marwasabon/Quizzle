{% extends 'base.html' %}

{% block title %}Quiz{% endblock %}

{% block content %}
<div class="quiz-container">
    <h1>Quiz on <span id="topic-title"></span></h1>
    <div id="flash-message" style="display: none;" class="flash-message"></div>

    <form id="quiz-form">
        <div id="questions-container"><p>Loading question...</p></div>
        <div class="button-container">
            <button type="button" id="submit-answer" class="btn btn-primary" disabled>Submit Answer</button>
            <button type="button" id="next-question" style="display: none;" class="btn btn-secondary">Next Question</button>
            <button type="button" id="cancel-quiz" class="btn btn-danger">Cancel</button>
        </div>
    </form>
</div>

<script>
    const topic = document.querySelector('.quiz-container').dataset.topic;
    const submitButton = document.getElementById('submit-answer');
    const nextButton = document.getElementById('next-question');
    const flashMessageDiv = document.getElementById('flash-message');
    document.getElementById('topic-title').textContent = topic;

    function showFlashMessage(message, type) {
        flashMessageDiv.textContent = message;
        flashMessageDiv.className = 'flash-message ' + type;
        flashMessageDiv.style.display = 'block';
    }

    function hideFlashMessage() {
        flashMessageDiv.style.display = 'none';
    }

    function displayQuestion(data) {
        const container = document.getElementById('questions-container');
        container.replaceChildren();

        const wrapper = document.createElement('div');
        wrapper.className = 'question';

        const text = document.createElement('p');
        text.textContent = data.question;
        wrapper.appendChild(text);

        ['A', 'B', 'C', 'D'].forEach(key => {
            const label = document.createElement('label');
            const input = document.createElement('input');
            input.type = 'radio';
            input.name = 'answer';
            input.value = key;
            label.appendChild(input);
            label.append(' ' + data.options[key]);
            wrapper.appendChild(label);
            wrapper.appendChild(document.createElement('br'));
        });

        container.appendChild(wrapper);
        submitButton.disabled = false;
        nextButton.style.display = 'none';
    }

    function generateQuestion() {
        hideFlashMessage();
        submitButton.disabled = true;
        nextButton.style.display = 'none';
        fetch('/generate_question', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ topic: topic })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                showFlashMessage(data.error, 'danger');
                nextButton.style.display = 'inline-block';
                return;
            }
            displayQuestion(data);
        })
        .catch(() => {
            showFlashMessage('Could not load a question. Please try again.', 'danger');
            nextButton.style.display = 'inline-block';
        });
    }

    submitButton.addEventListener('click', function () {
        const selected = document.querySelector('input[name="answer"]:checked');
        if (!selected) {
            showFlashMessage('Please select an answer.', 'warning');
            return;
        }
        submitButton.disabled = true;

        fetch('/submit_answer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ answer: selected.value })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                showFlashMessage(data.error, 'danger');
            } else {
                showFlashMessage(data.feedback, data.correct ? 'success' : 'danger');
                document.querySelectorAll('input[name="answer"]').forEach(input => input.disabled = true);
            }
            nextButton.style.display = 'inline-block';
        })
        .catch(() => {
            showFlashMessage('Could not submit your answer. Please try again.', 'danger');
            submitButton.disabled = false;
        });
    });

    nextButton.addEventListener('click', generateQuestion);

    document.getElementById('cancel-quiz').addEventListener('click', function () {
        if (confirm('Are you sure you want to leave the quiz?')) {
            window.location.href = '/home';
        }
    });

    window.addEventListener('load', generateQuestion);
</script>

<style>
    .quiz-container {
        background-color: rgba(26, 26, 31, 0.9); /* Slightly transparent background */
        padding: 20px;
        border-radius: 15px; /* Rounded corners */
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7); /* Shadow for depth */
        max-width: 600px; /* Max width of quiz container */
        margin: 80px auto; /* Center container with margin */
        text-align: center; /* Center text */
        color: white; /* Text color */
    }

    .flash-message {
        margin: 10px 0; /* Space between flash messages */
        padding: 10px; /* Padding around messages */
        border-radius: 5px; /* Rounded corners */
    }

    .flash-message.success { background-color: #1e7e34; }
    .flash-message.danger { background-color: #a71d2a; }
    .flash-message.warning { background-color: #b58105; }

    .button-container {
        display: flex;
        justify-content: space-between; /* Space between buttons */
        margin-top: 20px; /* Space above buttons */
    }

    .question {
        margin-bottom: 15px; /* Space between questions */
        text-align: left; /* Align text to the left */
    }

    .btn {
        border-radius: 15px; /* Rounded button */
        padding: 10px 20px; /* Button padding */
        cursor: pointer; /* Pointer cursor */
        transition: background-color 0.3s; /* Transition for hover effect */
    }

    .btn-primary {
        background-color: #007bff; /* Bootstrap primary color */
        color: white; /* Text color */
    }

    .btn-primary:hover {
        background-color: #0056b3; /* Darker shade on hover */
    }

    .btn-secondary {
        background-color: #6c757d; /* Secondary button color */
        color: white; /* Text color */
    }

    .btn-danger {
        background-color: #dc3545; /* Danger button color */
        color: white; /* Text color */
    }

    .btn-danger:hover {
        background-color: #c82333; /* Darker shade on hover */
    }
</style>
{% endblock %}
